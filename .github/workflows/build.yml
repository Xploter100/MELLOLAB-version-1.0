name: Build MELLOLAB

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar (CMake, x64)
        run: cmake -B build -A x64

      - name: Compilar (Release)
        run: cmake --build build --config Release --target MELLOLAB_VST3 --parallel 4

      - name: Subir VST3
        uses: actions/upload-artifact@v4
        with:
          name: MELLOLAB-VST3-Windows
          path: build/MELLOLAB_artefacts/Release/VST3/
